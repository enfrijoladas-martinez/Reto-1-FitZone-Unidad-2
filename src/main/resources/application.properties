spring.application.name=fitzone

spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8083}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fitzone}?useSSL=false&serverTimezone=America/Mexico_City&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jackson.time-zone=America/Mexico_City

fitzone.recordatorio.horas-antes=2
fitzone.recordatorio.intervalo-ms=60000
